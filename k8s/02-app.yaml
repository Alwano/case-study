apiVersion: apps/v1
kind: Deployment
metadata:
  name: country-info-service
  namespace: country-info
spec:
  replicas: 1
  selector:
    matchLabels:
      app: country-info-service
  template:
    metadata:
      labels:
        app: country-info-service
    spec:
      containers:
        - name: country-info-service
          image: country-info-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/country_info
            - name: SPRING_DATASOURCE_USERNAME
              value: country_app
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: country-db-secret
                  key: db-password
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: com.mysql.cj.jdbc.Driver
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
          readinessProbe:
            httpGet:
            path: /actuator/health/readiness
          port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: country-info-service
  namespace: country-info
spec:
  type: ClusterIP
  selector:
    app: country-info-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
env:
  - name: SPRING_DATASOURCE_URL
    value: jdbc:mysql://mysql:3306/country_info

  - name: SPRING_DATASOURCE_USERNAME
    value: country_app

  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: country-db-secret
        key: db-password

  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: com.mysql.cj.jdbc.Driver

  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: update