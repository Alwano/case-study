spring.application.name=country-info-service

# MySQL database configuration

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/country_info}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:testuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:TestUser}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server

server.port=8080

# Actuator health endpoint

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
